          nullable: false
      additionalProperties: false
    PaymentGateways.Checkout.PaymentRequest:
      type: object
      description: Information about the payment request, including the action required and any redirect URL. The remaining properties depend on the PaymentGateway named by `$type`.
      properties:
        $type:
          type: string
          description: The identifier of the PaymentGateway that produced the request, such as `stripe` or `satispay`. It tells you which gateway specific properties to expect alongside the documented ones.
        action:
          $ref: '#/components/schemas/PaymentGateways.CheckoutAction'
