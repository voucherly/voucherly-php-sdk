          nullable: true
        companyName:
          type: string
          description: Display name of the Company. Only populated when `groupBy` includes `Company`.
          nullable: true
        paidAmount:
          type: integer
          format: int64
          description: Total amount of paid transactions, in cents.
        cancelledAmount:
          type: integer
          format: int64
          description: Amount that was paid but not confirmed (paid minus confirmed), in cents.
        confirmedAmount:
          type: integer
          format: int64
          description: Total confirmed amount, in cents.
        refundedAmount:
          type: integer
          format: int64
          description: Total refunded amount, in cents.
        profitAmount:
          type: integer
