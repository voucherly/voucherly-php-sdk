      x-enum-descriptions:
        - Generic: The PaymentGateway refused the Transaction without a code Voucherly maps.
        - Cancelled: The payer abandoned the Transaction.
        - MissingPaymentMethod: The Transaction needs a PaymentMethod and none was supplied.
        - Declined: The PaymentGateway declined the Transaction; `declineErrorCode` says why, when it says.
        - Uncleared: The PaymentGateway accepted the Transaction but left it pending its own review.
        - AuthenticationFailed: Strong customer authentication did not complete.
