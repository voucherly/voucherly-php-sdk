          readOnly: true
        discounts:
          type: array
          description: An array of PaymentDiscount objects representing all discounts applied to this Payment.
          items:
            $ref: '#/components/schemas/Payments.PaymentDiscount'
        lines:
          type: array
          description: An array of PaymentLine objects representing the line items (products or services) included in this Payment.
          items:
            $ref: '#/components/schemas/Payments.PaymentLine'
          readOnly: true
      additionalProperties: false
    CreatePaymentRequest:
      type: object
      description: Request body for creating a Payment.
      required:
        - mode
      properties:
        referenceId:
          type: string
          description: A unique string to reference the Payment. This can be a customer ID, a cart ID, or similar, and can be used to reconcile the Payment with your internal systems.
          nullable: true
        referenceDate:
          type: string
          format: date
          description: The date this Payment refers to in your own system, when it differs from the date it is created on.
          nullable: true
        mode:
          $ref: '#/components/schemas/Payments.PaymentMode'
        companyId:
          type: string
          description: |
            The ID of the Company this Payment is associated with. If empty, the Company associated with the Customer will be used, if one exists.

            You cannot specify both `customerId` and `companyId` at the same time.
          nullable: true
        customerId:
          type: string
          description: The ID of the Customer of this Payment. If empty a new Customer will be created.
          nullable: true
        customerEmail:
          type: string
          description: The email address of the customer associated with this Payment. Required when `customerId` is not provided.
          nullable: true
        customerFirstName:
          type: string
          description: The first name of the customer associated with this Payment.
          nullable: true
        customerLastName:
          type: string
          description: The last name of the customer associated with this Payment.
          nullable: true
        customerPhoneNumber:
          type: string
          description: The phone number of the customer associated with this Payment.
          nullable: true
        customerPaymentMethodId:
          type: string
          description: The ID of the Customer's PaymentMethod to attach to this Payment.
          nullable: true
        selectedPaymentGatewayId:
          type: string
          description: Default PaymentGateway used for the first transaction.
          nullable: true
        paymentGatewayConfigurationId:
          type: string
          description: 'The ID of the PaymentGatewayConfiguration to use for this Payment, in the form `pgc_01kg2gestgepdbmsn7hs6bsrwp`. Use it when the same gateway is configured more than once and you need a specific configuration. When omitted, the configuration is resolved in this order: the default configuration of the API key used for the request, then the one of the Store the Payment refers to, then the Merchant default configuration.'
          nullable: true
          example: pgc_01kg2gestgepdbmsn7hs6bsrwp
        metadata:
          $ref: '#/components/schemas/Metadata'
        lines:
          type: array
          description: An array of PaymentLine objects representing the line items (products or services) to include in this Payment. Each line must reference a product either by `productId`, by an inline `product` object, or both (in which case the inline `product` overrides the referenced Product configuration).
          items:
            $ref: '#/components/schemas/Payments.PaymentLine.Request'
        discounts:
          type: array
          description: An array of PaymentDiscount objects representing all discounts applied to this Payment.
          items:
            $ref: '#/components/schemas/Payments.PaymentDiscount'
        timeout:
          type: integer
          description: Seconds the customer has to complete the checkout, after which the Payment is voided. Without it the checkout has no deadline of its own, and a Payment still `Requested` 12 hours after its creation is voided.
          format: int32
          nullable: true
        completionMode:
          type: string
          enum:
            - Standard
            - Partial
            - AnyTransaction
          description: 'When the Payment counts as paid. Defaults to `Standard`. With `Standard` the Payment stays open until its whole amount is paid, so the customer can combine several payment gateways, such as meal vouchers and a card for the rest. With `Partial` the first successful transaction completes the Payment, whatever it paid: `amount` is set to the paid amount, and anything left is settled outside this Payment. A failed transaction leaves the Payment open for another attempt. With `AnyTransaction` the Payment gets a single attempt: it completes as with `Partial` when the first transaction succeeds, and is voided when it fails. Use it on a card reader, where a declined card has to end the Payment. With `Partial` and `AnyTransaction` the checkout does not capture the transactions it authorized, so confirm the Payment or set `isAutoConfirm`. Both require a subscription plan that includes partial payments, except in sandbox.'
          nullable: true
        storeId:
          type: string
          description: The ID of an existing store, in the form `sto_01jkqh8ksaeszr3kme0vcq0hbz`. Use `store` instead to identify it by your own identifiers.
          nullable: true
        store:
          $ref: '#/components/schemas/CreatePaymentRequestStore'
        transactions:
          type: array
          description: Transactions to prepare on the Payment, each bound to a specific payment gateway. Use it to charge a gateway server-side instead of letting the customer pick one on the Checkout page.
          nullable: true
          items:
            $ref: '#/components/schemas/CreatePaymentRequestTransaction'
        isAutoConfirm:
          type: boolean
          description: "Enable or disable auto confirm.\r

            If you don't specify anything the default Merchant configuration will be used.\r

            When auto confirm is enabled, payment is automatically confirmed before redirecting customer to RedirectSuccessUrl.\r

            When auto confirm is disabled, payment requires manual confirmation."
          nullable: true
        exceedingAmountMode:
          type: string
          enum:
            - None
            - Credit
            - HideGateways
          description: "What to do when the amount to charge is below the minimum a payment gateway accepts — 0.50 EUR on most card gateways. The request is raised to that minimum, and this decides what happens to the part that exceeds what is due: with `None` it stays with you, with `Credit` it is credited to the customer's wallet. With `HideGateways` the amount is not raised at all: the gateway is not offered on the Checkout page, and a transaction requested on it fails with `AMOUNT_BELOW_MINIMUM`. Use `HideGateways` when nobody can pick another method, such as a charge on a terminal. If you don't specify anything the default Merchant configuration will be used."
          nullable: true
        redirectOkUrl:
          type: string
          description: The URL to which Voucherly should send customers when payment is complete.
          nullable: false
        redirectKoUrl:
          type: string
          description: The URL to which Voucherly should send customers when payment is cancelled or failed.
          nullable: false
        callbackUrl:
          type: string
          description: The URL where Voucherly will send a Server-to-Server (S2S) callback notification when the payment status changes. This allows your system to be notified synchronously about payment updates.
          nullable: true
        language:
          type: string
          description: The language of Voucherly Checkout page.
          nullable: true
        country:
          type: string
          description: The country of the purchase. If different from Italy, voucher payment gateways are not shown.
          nullable: true
        shippingAddress:
          type: string
          description: Purchase shipping address.
          nullable: true
      additionalProperties: false
    Payments.PaymentStatus:
      description: Current status of the Payment.
      enum:
        - Requested
        - Paid
        - Confirmed
        - Refunded
        - Cancelled
        - Voided
        - Expired
      type: string
    TenantMode:
      type: string
      description: Has the value "live" if the object exists in live mode, or "sand" if it exists in test mode.
      enum:
        - sand
        - live
      nullable: false
      readOnly: true
    PaymentGateways.CheckoutAction:
      description: The type of checkout action required by the payment gateway.
      enum:
        - DIRECT
        - OTP
        - OTP_CF
        - REDIRECT
        - DROPIN
      type: string
      x-enum-descriptions:
        - DIRECT: No interaction is required. The payment is charged server to server.
        - OTP: One-Time Password authentication is required. The customer needs to enter an OTP code.
        - OTP_CF: A One-Time Password is required together with the italian fiscal code of the payer.
        - REDIRECT: The customer must be redirected to an external URL to complete the payment.
        - DROPIN: An embedded payment form (drop-in) can be used within your application.
    CompanyAddressForExternalApi:
