    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
          description: A URI reference that identifies the problem type.
        title:
          type: string
          description: A short, human-readable summary of the problem type. It remains consistent across occurrences of the same error type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
        detail:
          type: string
          nullable: true
          description: A human-readable explanation specific to this occurrence of the problem.
      additionalProperties: true
    ValidationProblemDetails:
      properties:
        type:
          type: string
          nullable: true
          description: A URI reference that identifies the problem type.
          example: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title:
          type: string
          description: A short, human-readable summary of the problem type. It remains consistent across occurrences of the same error type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 400
        detail:
          type: string
          nullable: true
          description: A human-readable explanation specific to this occurrence of the problem.
        code:
          type: string
          description: For some errors that could be handled programmatically, a short string indicating the error code reported.
        parameter:
          type: string
          nullable: true
          description: If the error is parameter-specific, the parameter related to the error. For example, you can use this to display a message near the correct form field.
      additionalProperties: false
    PaymentConflictProblemDetails:
      properties:
        title:
          type: string
          description: A short, human-readable summary of the problem type. It remains consistent across occurrences of the same error type.
        status:
          type: integer
          format: int32
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 409
        detail:
          type: string
          nullable: true
          description: A human-readable explanation specific to this occurrence of the problem.
        code:
          type: string
          description: For some errors that could be handled programmatically, a short string indicating the error code reported.
        paymentStatus:
          allOf:
            - $ref: '#/components/schemas/Payments.PaymentStatus'
      additionalProperties: false
  responses:
    BadRequest:
      description: The request was unacceptable, often due to missing a required parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            ValidationError:
              $ref: '#/components/examples/ValidationErrorExample'
            ResourceMissing:
              $ref: '#/components/examples/ResourceMissingExample'
    NotFound:
      description: The requested resource doesn’t exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            type: https://datatracker.ietf.org/doc/html/rfc9110#section-15.5.5
            title: Customer was not found.
            status: 404
            detail: Entity "Customer" (cs_YZOJp96qKlW) was not found.
            additional:
              entity: Customer
              key: cs_YZOJp96qKlW
              error: NotFound
    PaymentConflict:
      description: The request conflicts with the current state of the target resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentConflictProblemDetails'
          examples:
            InvalidStatus:
              value:
                title: This operation cannot be processed because payment is in an invalid status.
                status: 409
                detail: Only 'Paid' payment can be confirmed.
                code: INVALID_STATUS
                paymentStatus: Requested
            AlreadyProcessed:
              value:
                title: This operation is already processed.
                status: 409
                code: ALREADY_CONFIRMED
                paymentStatus: Confirmed
    PaymentConfirmationBadRequest:
      description: The request can't be accepted as it stands.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            QuantityExceedsOrdered:
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 400
                detail: A line can be confirmed at most at the quantity it was ordered with.
                code: QUANTITY_EXCEEDS_ORDERED
                line: 0
                orderedQuantity: 3
            PiecesNotAllowed:
              summary: Pieces sent on a line that was not created with product.unit
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 400
                detail: Pieces can be sent only on a line created with 'Product.Unit'.
                code: PIECES_NOT_ALLOWED
                line: 1
            PiecesCountMismatch:
              summary: The pieces sent are not as many as the quantity delivered
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 400
                detail: "Send one piece per unit delivered: 'Pieces' must have 'Quantity' items."
                code: PIECES_COUNT_MISMATCH
                line: 0
                quantity: 2
                piecesCount: 3
            MarginNotConfirmable:
              summary: The preauthorization margin was sent with a quantity above zero
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 400
                detail: 'The preauthorization margin is released at confirmation: send it with quantity 0, or leave it out.'
                code: MARGIN_NOT_CONFIRMABLE
                line: 2
            ValidationError:
              $ref: '#/components/examples/ValidationErrorExample'
    PaymentConfirmationUnprocessable:
      description: The Payment can't be confirmed at the requested amounts. Unless `operations` lists something, no transaction was touched.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            RefundRequired:
              summary: Confirming would give back money already captured, and no RefundMode allows it
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 422
                detail: Confirming at these amounts gives back money already captured. Specify a RefundMode to allow it.
                code: REFUND_REQUIRED
                voucherRefundAmount: 1000
                refundAmount: 0
            LinesMismatch:
              summary: A line of the Payment is missing from `lines`, or one sent matches none
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 422
                detail: A line of the Payment is missing. Send every line, with quantity 0 for the ones not delivered.
                code: LINES_MISMATCH
                externalId: null
                productExternalId: '8009876543210'
                productName: Latte
            InvalidAmount:
              summary: Nothing was delivered, so there is nothing to confirm
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 422
                detail: The confirmed amount must be greater than zero. To give back the whole Payment, refund it.
                code: INVALID_AMOUNT
            AmountExceedsPaid:
              summary: The amount is higher than what the transactions can cover
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 422
                detail: The confirmed amount is higher than what the customer paid, or than what can be paid outside meal vouchers.
                code: AMOUNT_EXCEEDS_PAID
                maximumAmount: 10000
            CaptureBelowMinimum:
              summary: The amount left on an authorization is under the minimum the gateway captures
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 422
                detail: The amount left to capture is below the minimum amount of the payment gateway.
                code: CAPTURE_BELOW_MINIMUM
            CannotAllocate:
              summary: No split of the amounts across the transactions of the Payment adds up
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 422
                detail: The confirmed amounts can't be split across the transactions of the Payment.
                code: CANNOT_ALLOCATE
            ImpossiblePartialRefund:
              summary: The gateway can't refund that amount partially, by configuration or by its own answer
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 422
                detail: The payment gateway can't refund this amount partially. You can confirm with RefundMode 'Credit' or 'GatewayOrCredit'.
                code: IMPOSSIBLE_PARTIAL_REFUND
                transactionId: 81aa4db7-958b-43ac-9624-1a240c394c45
                refundAmount: 1000
            ImpossibleRefund:
              summary: The gateway refused the refund, after the captures were already done
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 422
                detail: The payment gateway refused to refund the transaction. You can confirm with RefundMode 'Credit' or 'GatewayOrCredit'.
                code: IMPOSSIBLE_REFUND
                paymentGatewayId: STRIPE
                transactionId: 81aa4db7-958b-43ac-9624-1a240c394c45
                operations:
                  - transactionId: 2f4c7f0e-5b8a-4d6e-9a51-0c3f7a1b2d44
                    paymentGatewayId: STRIPE
                    amount: 3000
            InsufficientFunds:
              summary: The gateway account has not enough balance to refund
              value:
                title: The Payment can't be confirmed at the requested amounts.
                status: 422
                detail: The transaction can't be refunded due to insufficient funds on your payment gateway account.
                code: INSUFFICIENT_FUNDS
                paymentGatewayId: STRIPE
                transactionId: 81aa4db7-958b-43ac-9624-1a240c394c45
    PaymentGatewayFailedDependency:
      description: A payment gateway failed. `operations` lists what was already done; sending the same request again settles what is left.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: The request couldn't be completed due to a failure in a dependency external to Voucherly.
            status: 424
            code: FAILED_DEPENDENCY
            paymentGatewayId: STRIPE
            transactionId: 81aa4db7-958b-43ac-9624-1a240c394c45
            operations:
              - transactionId: 2f4c7f0e-5b8a-4d6e-9a51-0c3f7a1b2d44
                paymentGatewayId: STRIPE
                amount: 3000
  examples:
    ValidationErrorExample:
      value:
        type: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title: One or more validation errors occurred.
        status: 400
        detail: You should provide a well formatted CustomerId.
        code: VALIDATION_ERROR
        parameter: CustomerId
    ResourceMissingExample:
      description: |
        Returned when a specified resource could not be found within the application domain, despite the request being syntactically correct.
        Unlike a `404 NOT FOUND`, this error indicates that the endpoint exists, but the referenced entity (e.g., CustomerId, OrderId) does not exist in the system.
      value:
        type: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title: CustomerId not found.
        status: 400
        detail: "No such CustomerId: 'cs_YZOJp96qKlW'."
        code: RESOURCE_MISSING
        parameter: CustomerId
  securitySchemes:
    Voucherly-API-Key:
      type: apiKey
      in: header
      name: Voucherly-API-Key
      description: |
        Sandbox mode secret keys have the prefix `sk_sand_` and live mode secret keys have the prefix `sk_live_`. Publishable keys (`pk_`) are not accepted.

        Platform keys (`ik_`) are issued to Voucherly products rather than to a merchant. They declare the merchant they operate on with the `Voucherly-Merchant-Id` header, and, when the key itself states no environment, the environment with the `Voucherly-Tenant` header.
    Voucherly-Merchant-Id:
      type: apiKey
      in: header
      name: Voucherly-Merchant-Id
      description: |
        Declares the merchant a request operates on. Required with a platform key (`ik_`), which belongs to no merchant; rejected with `401 Unauthorized` on a key that already belongs to one. A request that omits it where a merchant is needed is rejected with `400 Bad Request`.
    Voucherly-Tenant:
      type: apiKey
      in: header
      name: Voucherly-Tenant
      description: |
        Declares the environment a request operates on, `live` or `sand`. Required with a platform key that states no environment of its own (`ik_` with no `live`/`sand` segment); rejected with `401 Unauthorized` on a key that already states one, and on any value other than `live` or `sand`. A request that omits it is rejected with `400 Bad Request`, except on the endpoint that looks up an ecommerce site, which is the call that reveals which environment to declare.
