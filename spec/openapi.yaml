              $ref: '#/components/schemas/Stores.StoreRequest'
            example:
              name: Trattoria Bella Vista
              slug: bella-vista
              externalId1: MILANO-01
              isActive: false
      responses:
        '200':
          description: Returns the updated Store object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
