          nullable: false
        url:
          type: string
          description: The URL to redirect the customer to, if the action is REDIRECT. This URL is provided by the payment gateway.
          nullable: true
      additionalProperties: true
    PaymentGateways.PaymentGatewayType:
      description: The type of payment gateway.
      enum:
        - MealVoucher
