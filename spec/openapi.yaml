      x-enum-descriptions:
        - MealVoucher: A meal voucher payment gateway, such as Edenred or Pluxee.
        - CC: A card payment gateway, for credit and debit cards.
        - Other: Any other payment gateway, such as Klarna or Apple Pay and Google Pay.
        - Custom: A payment method of Voucherly itself, such as the wallet or the prepaid balance.
        - Hidden: A payment gateway that is never offered at checkout, such as manual payments.
    Payments.PaymentMode:
      enum:
        - Payment
