  /v1/stores:
    get:
      tags:
        - store
      operationId: list-store
      summary: List all Stores
      parameters:
        - name: name
          in: query
          required: false
          description: Filter by Stores whose name contains this value. The match is case-sensitive.
          schema:
            type: string
            maxLength: 100
        - name: isActive
          in: query
          required: false
          description: Filter by Store management status. When omitted, both active and inactive Stores are returned.
          schema:
            type: boolean
        - name: conceptStoreId
          in: query
          required: false
          description: Filter by the Stores assigned to this Concept Store.
          schema:
            $ref: '#/components/schemas/Id'
        - name: storeAreaId
          in: query
          required: false
          description: Filter by the Stores assigned to this Store Area.
          schema:
            $ref: '#/components/schemas/Id'
        - name: include
          in: query
          required: false
          description: Related data to embed in each Store. Omit to receive only the Store's own fields.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Stores.StoreInclude'
        - $ref: '#/components/parameters/PageSizeQueryParam'
        - $ref: '#/components/parameters/PageStartQueryParam'
      responses:
        '200':
          description: |
            A dictionary with an `items` property that contains an array of up to `length` Stores, starting after Store `start`, ordered by name. Each entry in the array is a separate Store object. If no more Stores are available, the resulting array will be empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: An array containing the actual response elements, paginated by any request parameters.
                    items:
                      $ref: '#/components/schemas/Store'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
        - store
      operationId: create-store
      summary: Create a Store
      description: |
        Creates a Store for the authenticated Merchant. `conceptStoreName`, `storeAreaName` and the `status` object are never returned by this operation; retrieve the Store with the `include` parameter to read them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stores.StoreRequest'
            example:
              name: Trattoria Bella Vista
              slug: bella-vista
              externalId1: MILANO-01
              isActive: true
              address:
                streetName: Via Roma
                streetNumber: '1'
                city: Milano
                province: MI
                postalCode: '20100'
                country: IT
      responses:
        '201':
          description: Returns a Store object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/BadRequest'
