  /v1/reports/volumes:
    get:
      tags:
        - reports
      operationId: volumes-report
      summary: Volumes
      description: |
        Returns aggregated turnover for the given date range, broken down by PaymentGateway and optionally by Store and/or Company, together with the grand totals across all rows. This is the same data shown in the Volumes report of the Voucherly Dashboard.
      parameters:
        - name: fromDate
          in: query
          required: true
          description: Start of the reporting period (inclusive). Only the date part is considered.
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          required: true
          description: End of the reporting period (inclusive). Only the date part is considered. Must be greater than or equal to `fromDate`, and the range cannot exceed 366 days.
          schema:
            type: string
            format: date-time
        - name: paymentMode
          in: query
          required: false
          description: Filter by payment mode. When omitted, wallet recharges are excluded and only payments are aggregated.
          schema:
            $ref: '#/components/schemas/Payments.PaymentMode'
        - name: groupBy
          in: query
          required: false
          description: How rows are grouped. Repeat the parameter to group by more than one dimension (e.g. `groupBy=Store&groupBy=Company`). When omitted, rows are aggregated per PaymentGateway only.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Reports.RevenuesGrouping'
        - name: paymentGatewayIds
          in: query
          required: false
          description: Filter by one or more PaymentGateway identifiers. Repeat the parameter to provide multiple values.
          schema:
            type: array
            items:
              type: string
        - name: storeIds
          in: query
          required: false
          description: Filter by one or more Store identifiers. Repeat the parameter to provide multiple values.
          schema:
            type: array
            items:
              type: string
        - name: companyIds
          in: query
          required: false
          description: Filter by one or more Company identifiers. Repeat the parameter to provide multiple values.
          schema:
            type: array
            items:
              type: string
        - $ref: '#/components/parameters/PageSizeQueryParam'
        - $ref: '#/components/parameters/PageStartQueryParam'
      responses:
        '200':
          description: |
            A dictionary with an `items` property containing the per-PaymentGateway breakdown (paginated by any request parameters), a `pagination` cursor, and a `totals` object with the grand totals computed across the whole result set (not just the current page).
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: An array containing the per-PaymentGateway breakdown rows, paginated by any request parameters.
                    items:
                      $ref: '#/components/schemas/Reports.RevenuesDetails'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
                  totals:
                    $ref: '#/components/schemas/Reports.RevenuesTotals'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      description: Unique identifier for the object.
      schema:
        $ref: '#/components/schemas/Id'
    CustomerIdPathParam:
      name: customerId
      in: path
      required: true
      description: Unique identifier for the Customer.
      schema:
        $ref: '#/components/schemas/Id'
    PaymentMethodIdPathParam:
      name: paymentMethodId
      in: path
      required: true
      description: Unique identifier for the PaymentMethod.
      schema:
        $ref: '#/components/schemas/Id'
    AddressIdPathParam:
      name: addressId
      in: path
      required: true
      description: Unique identifier for the Address.
      schema:
        $ref: '#/components/schemas/Id'
    PageSizeQueryParam:
      name: length
      in: query
      required: false
      description: A limit on the number of objects to be returned. Limit can range between 1 and 100, and the default is 10.
      schema:
        type: integer
    PageStartQueryParam:
      name: start
      in: query
      required: false
      description: A cursor for pagination across multiple pages of results. Don’t include this parameter on the first call. Use the `nextStart` value returned in a previous response to request subsequent results.
      schema:
        type: string
  schemas:
    Stores.StoreRequest:
      type: object
      description: The writable fields of a Store. Every field is replaced on update; omitted optional fields are cleared.
      required:
        - name
      properties:
        conceptStoreId:
          type: string
