      type: object
      properties:
        id:
          type: string
          description: The id of the transaction.
          format: uuid
        amount:
          type: integer
          description: If specified, is the partial amount to be confirmed.
          format: int32
          nullable: true
      additionalProperties: false
    ConfirmPaymentRequest:
      type: object
      description: |
        Specify at most one of:
        - nothing, to capture every authorized transaction in full;
        - `transactions`, to choose yourself which transactions to capture and for how much;
        - `lines`, to confirm the quantities actually delivered: Voucherly adds them up, discounts of the Payment included, and settles the transactions on that amount;
        - `finalAmount` with `foodAmount`, to confirm at an amount without resending the lines.

        A confirmation accounts, it does not rewrite the order: the lines, the discounts and the amounts of the Payment keep describing what was ordered, and what was settled is in `confirmedAmount`, `cancelledAmount` and `refundedAmount`, and per line in `confirmedQuantity`.

        With `lines` or with the amounts, meal vouchers cover at most the food amount and the other transactions cover the rest: authorizations are captured partially or voided. Money already captured is given back only as `refundMode` allows.
      properties:
        transactions:
          type: array
          description: List of transactions to be confirmed.
          items:
            $ref: '#/components/schemas/ConfirmPaymentRequest.Transaction'
          nullable: true
        lines:
          type: array
          description: |
            Every line of the Payment with the quantity delivered, `0` for a line not delivered. Each one is paired with a line of the Payment by your own `externalId` first and, when it is not sent, by product: `productId`, then `product.externalId`, then product name and variant, in any order; lines sharing the same product are paired in order of appearance, which is why sending your own `externalId` is the safe choice.
            Prices stay the ones ordered, a discount on the whole line follows the quantity, and the discounts of the Payment are applied to the amount delivered. The one way a line can cost more than ordered is `pieces`, on a line created with `product.unit`: their amounts replace the ordered price, within what the `PreauthorizationMargin` line authorised. The line keeps what was ordered and carries the result in `confirmedQuantity`, `confirmedFinalAmount` and `confirmedPieces`. A line missing or matching no line of the Payment fails with `LINES_MISMATCH`; a quantity above the ordered one fails with `QUANTITY_EXCEEDS_ORDERED`. The `PreauthorizationMargin` line is the exception: leave it out, or send it with quantity `0`.
          items:
            $ref: '#/components/schemas/ConfirmPaymentRequest.Line'
          nullable: true
        finalAmount:
          type: integer
          format: int32
          description: The amount to confirm, in cents. It only drives what is captured, voided and given back on the transactions. Requires `foodAmount`.
          nullable: true
        foodAmount:
          type: integer
          format: int32
          description: The part of `finalAmount` that meal vouchers can pay, in cents. Requires `finalAmount`, and can't be higher than it.
          nullable: true
        refundMode:
          $ref: '#/components/schemas/Payments.RefundMode'
      additionalProperties: false
    ConfirmPaymentRequest.Line:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          description: The quantity delivered, from `0` to the quantity ordered.
        externalId:
          type: string
          description: Your own reference of the line, as sent at creation. It pairs the line on its own; a value that matches no line of the Payment fails with `LINES_MISMATCH`, it never falls back to the product.
          nullable: true
        productId:
          type: string
          description: The ID of the Product of the line, when it was created with one.
          nullable: true
        product:
          type: object
          description: The product the line was created with, to pair it by product when the line is sent without its own ids.
          properties:
            externalId:
              type: string
              description: The external reference of the product, as sent in `product.externalId` at creation.
              nullable: true
            name:
              type: string
              nullable: true
            variant:
              type: string
              nullable: true
          additionalProperties: false
          nullable: true
        pieces:
          type: array
          description: One entry per item delivered, only on a line created with `product.unit`, as many as `quantity`. Send it when the amount charged differs from the ordered price, as it does with variable-weight items; without it the line is accounted at the ordered price. Fails with `PIECES_NOT_ALLOWED` on a line without `product.unit`, and with `PIECES_COUNT_MISMATCH` when the count differs from `quantity`.
          items:
            $ref: '#/components/schemas/Payments.PaymentLine.Piece'
          nullable: true
      required:
        - quantity
      additionalProperties: false
    Payments.RefundMode:
      description: |
        How money already captured is given back when the confirmed amounts are lower than what was captured. Authorizations are never refunded: they are captured partially or voided.
        - `NoRefund` (default): nothing is given back, and the request fails with `REFUND_REQUIRED` without touching any transaction.
        - `Gateway`: refunded through the payment gateway. When its configuration forbids a partial refund, the request fails before touching any transaction; when the gateway itself refuses the refund it has already been asked for, the captures of this confirmation are done and `operations` lists them.
        - `Credit`: credited to the customer's wallet, without calling the gateway. A credit coming from meal vouchers can be spent only on food.
        - `GatewayOrCredit`: refunded through the gateway where it allows it, credited to the wallet otherwise.
      enum:
        - NoRefund
        - Gateway
        - Credit
        - GatewayOrCredit
      type: string
      nullable: true
    RefundPaymentRequest.Transaction:
      type: object
      properties:
        id:
          type: string
          description: The id of the transaction.
          format: uuid
        amount:
          type: integer
          description: If specified, is the partial amount to be refunded.
          format: int32
          nullable: true
        asCredit:
          type: boolean
          description: Indicates whether the refunded amount should be added to the customer's wallet as credit.
          nullable: true
      additionalProperties: false
    RefundPaymentRequest:
      type: object
      properties:
        asCredit:
          type: boolean
          description: Indicates whether the refunded amount should be added to the customer's wallet as credit.
          nullable: true
        transactions:
          type: array
          description: List of transactions to be refunded.
          items:
            $ref: '#/components/schemas/RefundPaymentRequest.Transaction'
          nullable: true
      additionalProperties: false
    Reports.RevenuesGrouping:
      enum:
        - Store
        - Company
      type: string
      description: A grouping dimension for volumes report rows. `Store` breaks the rows down per Store; `Company` breaks them down per Company. With no dimension at all, rows are aggregated per PaymentGateway only.
      nullable: false
    Reports.RevenuesDetails:
