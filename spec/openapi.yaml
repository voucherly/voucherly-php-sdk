openapi: 3.0.1
servers:
  - url: https://api.voucherly.it
    description: Voucherly API
info:
  title: Voucherly API
  termsOfService: https://legal.voucherly.it/terms/service/
  description: |
    
    ## Introduction

    The Voucherly API is organized around [REST](http://en.wikipedia.org/wiki/Representational_State_Transfer). Our API has predictable resource-oriented URLs, accepts request bodies and returns responses in [JSON-encoded](http://www.json.org/) format (using [camelCase](https://en.wikipedia.org/wiki/Camel_case) notation), and uses standard HTTP response codes, authentication, and verbs.

    You can use the Voucherly API in sandbox mode, which doesn't affect your live data or interact with the banking networks. The API key you use to authenticate the request determines whether the request is live mode or test mode.
    ```
    https://api.voucherly.it
    ```

    ## Authentication    

    The Voucherly API uses API keys to authenticate requests. Sandbox mode secret keys have the prefix `sk_sand_` and live mode secret keys have the prefix `sk_live_`. You can view and manage your API keys in the [Voucherly Dashboard](https://dashboard.voucherly.it/Developer/ApiKey).

    Your API keys carry many privileges, so be sure to keep them secure! Do not share your secret API keys in publicly accessible areas such as GitHub, client-side code, and so forth.

    Publishable keys (`pk_sand_`, `pk_live_`) are meant for client-side code and are **not** accepted by this API: every request authenticated with one is rejected with `401 Unauthorized` and the message "This API call cannot be made with a publishable API key. Use your secret key from your server."

    Provide your API key as the "Voucherly-API-Key" header. For example:
    ```cURL []
    -H  "Voucherly-API-Key: sk_sand_BYsZDnaUWfVKGwHFvLop0dc9Fp1mE8py2Mtgm5aU6IrtCiuJg9s4747J"
    ```

    All API requests must be made over [HTTPS](http://en.wikipedia.org/wiki/HTTP_Secure). Calls made over plain HTTP will fail. API requests without authentication will also fail.
  contact:
    name: API Support
    email: support@voucherly.it
  version: v1
security:
  - Voucherly-API-Key: []
tags:
  - name: company
    description: |
      A Company represents an organization or business entity to which one or more customers can be associated. This logical grouping facilitates management and reporting at the company level. Each Company can have specific information linked to it, such as default delivery addresses, pricing rules, discounts, and other company-specific configurations.
    x-displayName: Companies
  - name: customer
    description: This object represents a customer of your business. Use it to save payment and contact information, and track payments that belong to the same customer.
    x-displayName: Customers
  - name: paymentMethod
    description: |
      PaymentMethod objects represent your Customer’s payment instruments. You can use them with Payments to collect payments or save them to Customer objects to store instrument details for future payments.
    x-displayName: Payment Methods
  - name: payment
    description: |
      A Payment guides you through the process of collecting a payment from your customer. We recommend that you create exactly one Payment for each order or customer session in your system. You can reference the Payment later to see the history of payment attempts for a particular session.

      A Payment transitions through [multiple statuses](https://docs.voucherly.it/en/guides/resources/payments-lifecycle) throughout its lifetime.
    x-displayName: Payments
  - name: paymentGateway
    description: |
      A PaymentGateway is a payment processor (e.g., Visa, Mastercard, Edenred, Satispay) that Voucherly uses to settle Payments. Each merchant can enable a subset of the available gateways and configure their parameters.
    x-displayName: Payment Gateways
  - name: receipt
    description: |
      A Receipt represents a fiscal document issued for a Payment, either a sale or a void/refund. Receipts can be retrieved or downloaded as PDFs.
    x-displayName: Receipts
  - name: terminal
    description: |
      A Terminal represents a physical POS device registered with a PaymentGateway and optionally bound to a Store. Terminals are used to process card-present payments.
    x-displayName: Terminals
  - name: store
    description: Merchant locations, including POS and payment configuration.
    x-displayName: Stores
  - name: conceptStore
    description: Brands used to group Stores.
    x-displayName: Concept Stores
  - name: storeArea
    description: Merchant-defined geographical or operational Store areas.
    x-displayName: Store Areas
  - name: reports
    description: |
      Reports expose aggregated analytics over your Payments. The volumes report returns turnover broken down by PaymentGateway (and optionally by Store) for a given date range, together with the grand totals across all rows. It mirrors the Volumes report available in the Voucherly Dashboard.
    x-displayName: Reports
paths:
  /v1/companys:
    post:
      tags:
        - company
      operationId: create-company
      summary: Create a Company
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
        required: true
      responses:
        '201':
          description: Returns a Company object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags:
        - company
      operationId: list-company
      summary: List all Companies
      parameters:
        - $ref: '#/components/parameters/PageSizeQueryParam'
        - $ref: '#/components/parameters/PageStartQueryParam'
      responses:
        '200':
          description: |
            A dictionary with an `items` property that contains an array of up to `length` Companies, starting after Company `start`. Each entry in the array is a separate Company object. If no more Companies are available, the resulting array will be empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: An array containing the actual response elements, paginated by any request parameters.
                    items:
                      $ref: '#/components/schemas/Company'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/companys/{idOrCode}:
    get:
      tags:
        - company
      operationId: retrieve-company
      summary: Retrieve a Company
      parameters:
        - name: idOrCode
          in: path
          required: true
          description: The unique identifier (ID) or join code of the Company to retrieve.
          schema:
            type: string
        - name: include
          in: query
          description: An array of nested object to be included in response.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - Addresses
      responses:
        '200':
          description: Returns a Company object if a valid identifier was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/customers:
    post:
      tags:
        - customer
      operationId: create-customer
      summary: Create a Customer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
            examples:
              Default:
                summary: Create a customer
                value:
                  email: mario.rossi@voucherly.it
                  firstName: Mario
                  lastName: Rossi
              Metadata:
                summary: Create a customer with metadata
                value:
                  email: mario.rossi@voucherly.it
                  firstName: Mario
                  lastName: Rossi
                  metadata:
                    crmId: crm-4821
                    plan: premium
              Email uniqueness:
                summary: Create a customer with email uniqueness
                value:
                  email: mario.rossi@voucherly.it
                  firstName: Mario
                  lastName: Rossi
                  options:
                    requireUniqueEmail: true
        required: true
      responses:
        '201':
          description: Returns a Customer object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags:
        - customer
      operationId: list-customer
      summary: List all Customers
      parameters:
        - name: email
          description: The Customer's email address.
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageSizeQueryParam'
        - $ref: '#/components/parameters/PageStartQueryParam'
      responses:
        '200':
          description: |
            A dictionary with a `items` property that contains an array of up to `length` Customers, starting after Customer `start`. Passing an optional email will result in filtering to Customers with only that exact email address. Each entry in the array is a separate Customer object. If no more Customers are available, the resulting array will be empty.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: An array containing the actual response elements, paginated by any request parameters.
                    items:
                      $ref: '#/components/schemas/Customer'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/customers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags:
        - customer
      operationId: retrieve-customer
      summary: Retrieve a Customer
      parameters:
        - name: include
          in: query
          description: An array of nested object to be included in response.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - Wallet
      responses:
        '200':
          description: Returns a Customer object if a valid identifier was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - customer
      operationId: update-customer
      summary: Update a Customer
      description: Updates the specified customer by setting the values of the parameters passed. Any parameters not provided will be left unchanged.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
        required: true
      responses:
        '200':
          description: Returns a Customer object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/customers/{customerId}/payment_methods:
    get:
      tags:
        - paymentMethod
      operationId: list-customer-payment-method
      summary: List a Customer's PaymentMethods
      description: Returns a paginated list of the PaymentMethods saved on the Customer, the most recent first.
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
        - $ref: '#/components/parameters/PageSizeQueryParam'
        - $ref: '#/components/parameters/PageStartQueryParam'
      responses:
        '200':
          description: |
            A dictionary with an `items` property that contains an array of PaymentMethods, plus a `pagination` cursor. Each entry in the array is a separate PaymentMethod object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: An array containing the actual response elements, paginated by any request parameters.
                    items:
                      $ref: '#/components/schemas/PaymentMethod'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/customers/{customerId}/payment_methods/{paymentMethodId}:
    delete:
      tags:
        - paymentMethod
      operationId: delete-customer-payment-method
      summary: Delete a Customer's PaymentMethod
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
        - $ref: '#/components/parameters/PaymentMethodIdPathParam'
      responses:
        '204':
          description: ''
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/customers/{customerId}/prepaid:
    get:
      tags:
        - customer
      operationId: retrieve-customer-prepaid-balance
      summary: Retrieve a Customer's prepaid balance
      description: Returns the prepaid balance available to a Customer for a given date, based on the prepaid policy configured on the Customer's Company.
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
        - name: date
          in: query
          required: true
          description: The date for which the prepaid balance must be evaluated, in `YYYY-MM-DD` format.
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Returns a CustomerPrepaidBalance object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customers.CustomerPrepaidBalance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/customers/{id}/wallet/movements:
    get:
      tags:
        - customer
      operationId: list-customer-wallet-movement
      summary: List a Customer's wallet movements
      description: Returns a paginated list of wallet movements (credits, debits, refunds, adjustments) recorded on the Customer's wallet.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - name: fromDate
          in: query
          required: false
          description: Lower bound (inclusive) of the movement timestamp filter, in UTC.
          schema:
            type: string
            format: date-time
        - name: toDate
          in: query
          required: false
          description: Upper bound (inclusive) of the movement timestamp filter, in UTC.
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/PageSizeQueryParam'
        - $ref: '#/components/parameters/PageStartQueryParam'
      responses:
        '200':
          description: |
            A dictionary with an `items` property that contains an array of CustomerWalletMovement objects, plus a `pagination` cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: An array containing the actual response elements, paginated by any request parameters.
                    items:
                      $ref: '#/components/schemas/Customers.CustomerWalletMovement'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/customers/{customerId}/addresses:
    get:
      tags:
        - customer
      operationId: list-customer-address
      summary: List a Customer's Addresses
      description: Returns a paginated list of the Addresses of the Customer, the most recent first.
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
        - $ref: '#/components/parameters/PageSizeQueryParam'
        - $ref: '#/components/parameters/PageStartQueryParam'
      responses:
        '200':
          description: |
            A dictionary with an `items` property that contains an array of CustomerAddress objects, plus a `pagination` cursor.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    description: An array containing the actual response elements, paginated by any request parameters.
                    items:
                      $ref: '#/components/schemas/Customers.CustomerAddress'
                  pagination:
                    $ref: '#/components/schemas/PaginationResponse'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - customer
      operationId: create-customer-address
      summary: Create a Customer's Address
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customers.CustomerAddress.Request'
        required: true
      responses:
        '201':
          description: Returns the created CustomerAddress object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customers.CustomerAddress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/customers/{customerId}/addresses/{addressId}:
    get:
      tags:
        - customer
      operationId: retrieve-customer-address
      summary: Retrieve a Customer's Address
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
        - $ref: '#/components/parameters/AddressIdPathParam'
      responses:
        '200':
          description: Returns a CustomerAddress object if a valid identifier was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customers.CustomerAddress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - customer
      operationId: update-customer-address
      summary: Update a Customer's Address
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
        - $ref: '#/components/parameters/AddressIdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Customers.CustomerAddress.Request'
        required: true
      responses:
        '201':
          description: Returns the updated CustomerAddress object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customers.CustomerAddress'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - customer
      operationId: delete-customer-address
      summary: Delete a Customer's Address
      parameters:
        - $ref: '#/components/parameters/CustomerIdPathParam'
        - $ref: '#/components/parameters/AddressIdPathParam'
      responses:
        '204':
          description: ''
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payments:
    post:
      tags:
        - payment
      operationId: create-payment
      summary: Create a Payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              New customer:
                summary: Create payment with new customer
                value:
                  mode: Payment
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  customerFirstName: Mario
                  customerLastName: Rossi
                  customerEmail: mario.rossi@voucherly.it
                  country: IT
                  lines:
                    - quantity: 2
                      unitAmount: 250
                      unitDiscountAmount: 10
                      product:
                        externalId: SKU-MUFFIN-001
                        name: Muffin
                        lineType: Food
                  discounts:
                    - discountName: Coupon XSDWFE
                      amount: 200
              Existing customer:
                summary: Create payment for an existing customer
                value:
                  mode: Payment
                  customerId: cs_5vY3nKp8QwR
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  language: it
                  country: IT
                  shippingAddress: Via Alessandro Tadino 3, Milano
                  metadata:
                    orderId: order-123
                  lines:
                    - quantity: 2
                      unitAmount: 250
                      unitDiscountAmount: 10
                      product:
                        externalId: SKU-MUFFIN-001
                        name: Muffin
                        lineType: Food
                        taxRate: 10
                  discounts:
                    - discountName: Coupon XSDWFE
                      amount: 200
              New store:
                summary: Create payment on a store identified by your own ids
                value:
                  mode: Payment
                  customerId: cs_5vY3nKp8QwR
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  store:
                    externalId1: '35'
                    name: Punto vendita Milano
                  lines:
                    - quantity: 2
                      unitAmount: 250
                      product:
                        externalId: SKU-MUFFIN-001
                        name: Muffin
                        lineType: Food
              Variable weight:
                summary: Create payment with a line sold by weight and the margin that covers it
                value:
                  mode: Payment
                  customerId: cs_5vY3nKp8QwR
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  country: IT
                  lines:
                    - quantity: 2
                      unitAmount: 149
                      externalId: '5068138459'
                      product:
                        externalId: '761703'
                        name: Susine gialle
                        lineType: Food
                        unit:
                          code: kg
                          size: 0.75
                          amount: 198
                    - quantity: 3
                      unitAmount: 95
                      externalId: '5068138461'
                      product:
                        externalId: '120738'
                        name: Pasta sfoglia rotonda 230 g
                        lineType: Food
                    - quantity: 1
                      unitAmount: 500
                      product:
                        name: Margine peso variabile
                        lineType: PreauthorizationMargin
              Partial completion:
                summary: Create payment the customer can pay partially
                value:
                  mode: Payment
                  completionMode: Partial
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  country: IT
                  lines:
                    - quantity: 2
                      unitAmount: 250
                      product:
                        externalId: SKU-MUFFIN-001
                        name: Muffin
                        lineType: Food
              Auto confirm:
                summary: Create payment confirmed automatically
                value:
                  mode: Payment
                  customerId: cs_5vY3nKp8QwR
                  isAutoConfirm: true
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  country: IT
                  lines:
                    - quantity: 2
                      unitAmount: 250
                      product:
                        externalId: SKU-MUFFIN-001
                        name: Muffin
                        lineType: Food
              Preselected gateway:
                summary: Create payment redirecting straight to one payment gateway
                value:
                  mode: Payment
                  customerId: cs_5vY3nKp8QwR
                  selectedPaymentGatewayId: SATISPAY
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  country: IT
                  lines:
                    - quantity: 2
                      unitAmount: 250
                      product:
                        externalId: SKU-MUFFIN-001
                        name: Muffin
                        lineType: Food
              Transactions:
                summary: Create payment charging a gateway server-side
                value:
                  mode: Payment
                  customerId: cs_5vY3nKp8QwR
                  transactions:
                    - paymentGatewayId: PREPAID
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  country: IT
                  lines:
                    - quantity: 2
                      unitAmount: 5050
                      product:
                        externalId: SKU-MUFFIN-001
                        name: Muffin
                        lineType: Food
              Terminal:
                summary: Create payment collected on a card reader
                value:
                  mode: Payment
                  referenceId: 00011.007.451.11143
                  transactions:
                    - paymentGatewayId: POS
                      details:
                        referenceTerminalId: '00011.007'
                  completionMode: AnyTransaction
                  exceedingAmountMode: HideGateways
                  isAutoConfirm: true
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  country: IT
                  lines:
                    - quantity: 1
                      unitAmount: 140
                      product:
                        externalId: SKU-MUFFIN-001
                        name: Muffin
                        lineType: Food
              Server-to-server callback:
                summary: Create payment notified over a S2S callback
                value:
                  mode: Payment
                  customerId: cs_5vY3nKp8QwR
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  callbackUrl: https://httpbin.org/post
                  country: IT
                  lines:
                    - quantity: 2
                      unitAmount: 250
                      product:
                        externalId: SKU-MUFFIN-001
                        name: Muffin
                        lineType: Food
              Wallet:
                summary: Create a Wallet to save a payment method
                value:
                  mode: Wallet
                  redirectOkUrl: https://httpbin.org/get
                  redirectKoUrl: https://httpbin.org/get
                  customerFirstName: Mario
                  customerLastName: Rossi
                  customerEmail: mario.rossi@voucherly.it
                  country: IT
      responses:
        '201':
          description: Returns a Payment object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/payments/{id}:
    get:
      tags:
        - payment
      operationId: retrieve-payment
      summary: Retrieve a Payment
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
        - name: include
          in: query
          description: An array of nested object to be included in response.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - Lines
                - Discounts
                - Transactions
        - name: Voucherly-Wait-Time
          in: header
          description: Seconds that the call will be hanging, waiting for a payment status change. Maximum value is 60 seconds.
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Returns a Payment object if a valid identifier was provided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/payments/{id}/confirm:
    post:
      tags:
        - payment
      operationId: confirm-payment
      summary: Confirm a Payment
      description: |
        Captures a `Paid` Payment. Send the lines actually delivered, or the final and food amounts, and Voucherly decides how much to capture, void or give back on each transaction.

        The Payment stays `Paid` until every operation has succeeded. When a payment gateway fails midway, the response lists the operations already done and the same request can be sent again: it settles only what is left.
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentRequest'
            examples:
              Full:
                summary: Capture every authorized transaction in full
                value: {}
              Delivered lines:
                summary: Confirm the quantities delivered, crediting to the wallet the meal vouchers exceeding the food amount
                value:
                  lines:
                    - quantity: 2
                      product:
                        externalId: '8001234567890'
                    - quantity: 0
                      product:
                        externalId: '8009876543210'
                  refundMode: Credit
              Weighed pieces:
                summary: Confirm two packs of plums at the weight delivered, pairing the lines by your own line ids and releasing the preauthorization margin
                value:
                  lines:
                    - quantity: 2
                      externalId: '5068138459'
                      pieces:
                        - finalAmount: 129
                          size: 0.65
                        - finalAmount: 139
                          size: 0.7
                    - quantity: 3
                      externalId: '5068138461'
              Amounts:
                summary: Confirm lower amounts without resending the lines
                value:
                  finalAmount: 9500
                  foodAmount: 8500
              Single transaction:
                summary: Capture part of one transaction
                value:
                  transactions:
                    - id: 81aa4db7-958b-43ac-9624-1a240c394c45
                      amount: 250
