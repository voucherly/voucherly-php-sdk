              nullable: true
            unit:
              allOf:
                - $ref: '#/components/schemas/Payments.PaymentLine.Unit'
              description: How the line is sold when the piece is not what it is priced by. Declare it on every line whose price can change at delivery, since only such a line accepts `pieces` at confirmation.
              nullable: true
          additionalProperties: false
          nullable: true
