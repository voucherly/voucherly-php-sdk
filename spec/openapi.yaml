      parameters:
        - name: storeId
          in: query
          required: false
          description: Returns the PaymentGateways of the configuration the Store resolves to. Ignored when `paymentGatewayConfigurationId` is given.
          schema:
            type: string
        - name: paymentGatewayConfigurationId
          in: query
          required: false
          description: Returns the PaymentGateways of one specific configuration, in the form `pgc_01kg2gestgepdbmsn7hs6bsrwp`. With neither this nor `storeId`, the default configuration of the merchant is used.
          schema:
            type: string
        - name: all
          in: query
          required: false
          description: Specifies whether to return all payment gateways or only those that are enabled. If true, returns all payment gateways regardless of their enabled status. If false or omitted, returns only enabled payment gateways.
          schema:
            type: boolean
        - name: include
          in: query
          required: false
          description: An array of nested objects to include in the response.
          schema:
            type: array
            items:
              type: string
              enum:
                - Parameters
      responses:
        '200':
          description: |
            A dictionary with an `items` property that contains an array of PaymentGateway objects. Each entry in the array is a separate PaymentGateway object.
          content:
            application/json:
              schema:
