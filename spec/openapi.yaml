          nullable: false
        discountDescription:
          type: string
          description: The discount’s description. Use this field to optionally store a long form explanation of the product being sold for your own rendering purposes.
          nullable: true
        amount:
          type: integer
          description: A non-negative integer in cents representing how much to subtract from the total. Must be specified when both `type` and `value` are null.
          format: int32
        type:
          $ref: '#/components/schemas/Payments.DiscountType'
        value:
          type: integer
          description: The value of the discount, contextual to the selected `type`. Must be specified when `type` is provided and `amount` is null.
          format: int32
          nullable: true
        index:
          type: integer
          description: Defines the application order of this discount relative to others.
          format: int32
          nullable: true
        externalId1:
          type: string
          description: Primary external reference for the discount, used by Voucherly to reconcile it across systems and to correctly compute reporting.
          nullable: true
        externalId2:
          type: string
          description: Secondary external reference for the discount, used by Voucherly to reconcile it across systems and to correctly compute reporting.
          nullable: true
        couponCode:
          type: string
          description: The coupon code the payer entered to obtain this discount.
          nullable: true
        points:
          type: integer
          format: int32
          description: The loyalty points spent to obtain this discount.
      additionalProperties: false
    Payments.DiscountType:
      enum:
        - DOLLAROFF
        - PERCENOFF
        - FIXED
      description: |
        Defines how the discount is calculated:
        - `DOLLAROFF`: A fixed amount in cents is subtracted from the total.
        - `PERCENOFF`: A percentage of the total amount is subtracted.
        - `FIXED`: The final price is set to a fixed amount, overriding the original total.
      type: string
    Payments.PaymentLine:
      type: object
      description: |
        Response shape of a PaymentLine, returned within a Payment object.

        Note: when creating a Payment, the request body uses a different, normalized shape that nests product fields under a `product` object. See `Payments.PaymentLine.Request` for the create-payment request line shape.
      properties:
        quantity:
          type: integer
          format: int32
          description: The quantity of the line item being purchased.
        unitAmount:
          type: integer
          format: int32
          description: A non-negative integer in cents representing how much to charge for each individual unit.
        unitDiscountAmount:
          type: integer
          format: int32
          description: A non-negative integer in cents representing the discount applied to each individual unit.
        discountAmount:
          type: integer
          format: int32
          description: A non-negative integer in cents representing the total discount applied to the entire line.
        totalAmount:
          type: integer
          format: int32
          description: '`unitAmount` times `quantity`, in cents. Compute it from those two instead.'
          deprecated: true
          readOnly: true
        totalDiscountAmount:
          type: integer
          format: int32
          description: '`unitDiscountAmount` times `quantity`, in cents. Compute it from those two instead.'
          deprecated: true
          readOnly: true
        finalAmount:
          type: integer
          format: int32
          description: A non-negative integer in cents representing the final amount charged for this line, after discounts.
          readOnly: true
        productId:
          type: string
          description: The ID of the Product that this PaymentLine refers to, when the line was created against an existing Voucherly Product.
          nullable: true
        productName:
          type: string
          description: The product’s name, meant to be displayable to the customer.
          nullable: false
        productVariant:
          type: string
          description: The product’s variant description, meant to be displayable to the customer.
          nullable: true
        productImage:
          type: string
          description: The product’s image URL, meant to be displayable to the customer.
          nullable: true
        productExternalId1:
          type: string
          description: 'The external reference of the product of the line, as sent in `product.externalId`: the SKU or code you use for it. Distinct from the reference of the line.'
          nullable: true
        externalId:
          type: string
          description: Your own reference of the line, as sent at creation, typically the id of the order line in your system. At confirmation it pairs the line on its own.
          nullable: true
        unit:
          allOf:
            - $ref: '#/components/schemas/Payments.PaymentLine.Unit'
          description: How the line is sold when the piece is not what it is priced by, as sent at creation. Absent on a line sold by the piece.
          nullable: true
        taxRate:
          type: number
          format: double
          description: The product's applicable tax rate.
          nullable: true
        lineType:
          $ref: '#/components/schemas/Payments.LineType'
        isFood:
          type: boolean
          description: True when `lineType` is `Food`. Read `lineType` instead.
          deprecated: true
          readOnly: true
        isGift:
          type: boolean
          description: Indicates whether this PaymentLine is a gift item.
        origin:
          $ref: '#/components/schemas/Payments.LineOrigin'
        confirmedQuantity:
          type: integer
          format: int32
          description: The quantity the confirmation accounted for, when it differs from the one ordered. Absent while the line stands as ordered, which is what every other field describes.
          nullable: true
        confirmedFinalAmount:
          type: integer
          format: int32
          description: The final amount of the line as confirmed, in cents, discount of the line included. Absent together with `confirmedQuantity`.
          nullable: true
        confirmedPieces:
          type: array
          description: The pieces the line was confirmed with, one per item delivered, when the confirmation sent them. Their amounts add up to `confirmedFinalAmount`, which may then exceed `finalAmount`.
          items:
            $ref: '#/components/schemas/Payments.PaymentLine.Piece'
          nullable: true
      additionalProperties: false
    Payments.LineType:
      description: |
        What the PaymentLine is, which decides both how the checkout lays it out and whether meal vouchers can pay it:
        - `NonFood`: goods that are not food, such as detergents or household items. Not payable with meal vouchers, and the default when the line declares nothing.
        - `Food`: grocery food. The only type meal vouchers can pay.
        - `Shipping`: shipping costs. The checkout always shows it after the products, whatever position you send it in.
        - `AdditionalCharge`: a delivery service, a tip or any other accessory charge. Shown after the products, like `Shipping`.
        - `PreauthorizationMargin`: the margin authorised on top of the estimated total, covering variable-weight items and released once the effective amount is confirmed. The checkout does not list it among the products: it counts towards the total, and an info icon next to it explains the difference. Send `product.name` and `product.variant` on that line to replace the default wording of that explanation. At confirmation it is released whether you send it back or not: send it with quantity `0` or leave it out, anything else fails with `MARGIN_NOT_CONFIRMABLE`. It is never printed on the documents for the customer.
      enum:
        - NonFood
        - Food
        - Shipping
        - AdditionalCharge
        - PreauthorizationMargin
      type: string
    Payments.LineOrigin:
      description: |
        Where the PaymentLine comes from:
        - `Standard`: the line was part of the original order.
        - `TableUpsell`: the line was added by an upselling proposal accepted while paying at the table.
      enum:
        - Standard
        - TableUpsell
      type: string
    Payments.PaymentLine.Unit:
      type: object
      description: |
        How a line is sold when the piece is not what it is priced by: a pack of plums is one piece of about 0.75 kg at 1.98 €/kg. Descriptive only: no amount is computed from it, `unitAmount` times `quantity` stays what the customer pays, and your till keeps rounding each piece on its own.
      properties:
        code:
          type: string
          description: The unit of measure, such as `kg` or `l`. At most 10 characters.
        size:
          type: number
          format: double
          description: The nominal content of one piece, in the unit of `code`. At most three decimals.
          nullable: true
        amount:
          type: integer
          format: int32
          description: The price per unit of measure, in cents.
          nullable: true
      required:
        - code
      additionalProperties: false
    Payments.PaymentLine.Piece:
      type: object
      description: One item delivered on a line sold by measure, with the amount charged for it.
      properties:
        finalAmount:
          type: integer
          format: int32
          description: The amount charged for this piece, in cents, net of any discount. It is taken as it is, and it may exceed the ordered price.
        size:
          type: number
          format: double
          description: The measured content of the piece, in the unit of `unit.code`. Printed on the documents, never used to compute anything.
          nullable: true
      required:
        - finalAmount
      additionalProperties: false
    CreatePaymentRequestStore:
      type: object
      description: The store the Payment belongs to, identified by your own identifiers. When no store matches, Voucherly creates one on the fly.
      nullable: true
      properties:
        externalId1:
          type: string
          description: Your primary identifier for the store.
          nullable: true
        externalId2:
          type: string
          description: Your secondary identifier for the store.
          nullable: true
        name:
          type: string
          description: The name of the store, used when Voucherly has to create it.
          nullable: true
      additionalProperties: false
    CreatePaymentRequestTransaction:
      type: object
      description: A transaction prepared on a specific payment gateway.
      properties:
        paymentGatewayId:
          type: string
          description: The id of the payment gateway that will process this transaction.
          nullable: false
        amount:
          type: integer
          format: int32
          description: The amount of this transaction, in cents. When omitted the whole Payment amount is used.
          nullable: true
        requireSingleTransactionForWholePayment:
          type: boolean
          description: "Honored only by the `Wallet` and `Prepaid` payment gateways: every other gateway ignores it. When true and the customer's balance does not cover the amount of this transaction, the transaction is declined instead of drawing what is available. The Payment is created anyway, and the response is a 422 that carries it. When false, the transaction draws as much of the balance as the Payment still needs, and `completionMode` decides whether the Payment stays open for the rest."
        details:
          type: object
          description: 'Gateway-specific details of the transaction. Only `POS` takes them today, to say which card reader must collect the payment: give exactly one of the three identifiers below. The Terminal is looked up across the whole merchant, so it must be paired and, for `referenceTerminalId`, carry that reference — otherwise the request fails with `RESOURCE_MISSING` and no Payment is created.'
          nullable: true
          properties:
            terminalId:
              type: string
              description: The ID of the Terminal in Voucherly, in the form `term_01kg2gestgepdbmsn7hs6bsrwp`.
              nullable: true
            externalTerminalId:
              type: string
              description: The ID the payment gateway gave the reader, as returned by the Terminals endpoint.
              nullable: true
            referenceTerminalId:
              type: string
              description: Your own reference for the reader, set on the Terminal from the Voucherly dashboard. Use it to address a reader by the code your cash register already knows, such as `00011.007`.
              nullable: true
          additionalProperties: false
      additionalProperties: false
    Payments.PaymentLine.Request:
      type: object
      description: |
        Request shape of a PaymentLine, used in the create-payment request body. Product attributes are grouped under a nested `product` object; pricing and discount amounts stay at the line level.

        Each line must specify the product through one of:
        - `productId` only — all product details are loaded from the referenced Voucherly Product.
        - `product` only — inline ad-hoc product description; required fields inside `product` must be populated.
        - `productId` + `product` — the line is linked to the referenced Product, and any field set inside `product` overrides the corresponding value of the Product configuration (useful to force a specific price, name, etc.).
      properties:
        quantity:
          type: integer
          description: The quantity of the line item being purchased.
          format: int32
        unitAmount:
          type: integer
          description: A non-negative integer in cents representing how much to charge for each individual unit. Required when `productId` is not specified.
          format: int32
          nullable: true
        unitDiscountAmount:
          type: integer
          description: A non-negative integer in cents representing the discount applied to each individual unit. This field is mutually exclusive with `discountAmount` — only one of the two may be specified.
          format: int32
        discountAmount:
          type: integer
          description: A non-negative integer in cents representing the total discount applied to the entire line. This field is mutually exclusive with `unitDiscountAmount` — only one of the two may be specified.
          format: int32
        productId:
          type: string
          description: The ID of an existing Product in Voucherly that this PaymentLine refers to. One of `productId` or `product` is required.
          nullable: true
        externalId:
          type: string
          description: Your own reference of the line, such as the id of the order line in your system, when you have one. It is a reference of the line, not of its product, and at confirmation it pairs the line on its own, which is what tells two lines of the same product apart. At most 100 characters.
          nullable: true
        product:
          type: object
          description: |
            Inline description of the product associated with a PaymentLine, used inside the create-payment request body. Contains only product attributes; pricing and discount amounts are line-level fields on `Payments.PaymentLine.Request`.

            When the line also specifies a `productId`, all fields below are optional and any populated value overrides the configuration of the referenced Product. When `productId` is not specified, `name` must be populated (and `unitAmount` must be populated at the line level).
