          nullable: true
          readOnly: true
        receipt:
          allOf:
            - $ref: '#/components/schemas/Receipt'
          description: The Receipt issued for this Payment.
          readOnly: true
        refundReceipt:
          allOf:
            - $ref: '#/components/schemas/Receipt'
          description: The Receipt issued for the refund of this Payment.
          readOnly: true
        created:
