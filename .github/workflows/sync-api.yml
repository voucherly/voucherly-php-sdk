name: Sync API

on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit or branch of voucherly-docs to read the spec from
        required: false
        default: main
  # A fallback for a dispatch that never arrives, for example because its token expired.
  schedule:
    - cron: '17 6 * * 1'

# The branch and the pull request go through SDK_TOKEN, an organization secret: the organization forbids GITHUB_TOKEN to open pull requests, and a pull request opened with GITHUB_TOKEN would not start the CI.
permissions:
  contents: read

concurrency:
  group: sync-api
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SDK_TOKEN }}
      DOCS_REF: ${{ github.event.client_payload.sha || inputs.sha || 'main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SDK_TOKEN }}

      - name: Choose the branch
        run: |
          branch=$(gh pr list --state open --base main --json headRefName --jq '[.[].headRefName | select(startswith("sync-api/"))][0] // empty')
          if [ -n "$branch" ]; then
            git fetch --depth 1 origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
            echo "EXISTING_PR=true" >> "$GITHUB_ENV"
            echo "COMPARED_WITH=$branch" >> "$GITHUB_ENV"
          else
            branch="sync-api/$(date -u +%Y-%m-%d)"
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              branch="sync-api/$(date -u +%Y-%m-%d-%H%M)"
            fi
            git checkout -b "$branch"
            echo "EXISTING_PR=false" >> "$GITHUB_ENV"
            echo "COMPARED_WITH=main" >> "$GITHUB_ENV"
          fi
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Download the spec
        id: spec
        run: |
          if ! [[ "$DOCS_REF" =~ ^([0-9a-f]{7,40}|main)$ ]]; then
            echo "::error::'$DOCS_REF' is neither a commit nor main."
            exit 1
          fi
          curl -fsSL "https://raw.githubusercontent.com/voucherly/voucherly-docs/${DOCS_REF}/static/download/openapi.yaml" -o spec/openapi.yaml
          if git diff --quiet -- spec/openapi.yaml; then
            echo "Nothing to do: the spec at voucherly-docs@${DOCS_REF} is the one already in ${COMPARED_WITH}." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: shivammathur/setup-php@v2
        if: steps.spec.outputs.changed == 'true'
        with:
          php-version: '8.3'
          extensions: curl, json
          coverage: none

      - name: Regenerate and check
        if: steps.spec.outputs.changed == 'true'
        run: |
          composer update --no-interaction --no-progress --prefer-dist
          set +e
          php tools/generate.php > generate.log 2>&1
          generate=$?
          echo "GENERATE_EXIT=$generate" >> "$GITHUB_ENV"
          if [ "$generate" = "0" ]; then
            vendor/bin/php-cs-fixer fix lib --quiet
          fi
          vendor/bin/phpunit > tests.log 2>&1
          echo "TESTS_EXIT=$?" >> "$GITHUB_ENV"
          php tools/check-coverage.php > coverage.log 2>&1
          echo "COVERAGE_EXIT=$?" >> "$GITHUB_ENV"

      - name: Commit
        if: steps.spec.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- spec/openapi.yaml lib/Model lib/Request lib/Enum
          git commit --quiet -m "Sync the spec with voucherly-docs@${DOCS_REF}"
          git push --quiet origin "HEAD:refs/heads/${BRANCH}"

      - name: Open or update the pull request
        if: steps.spec.outputs.changed == 'true'
        run: |
          status() { [ "$1" = "0" ] && echo "passed" || echo "**failed**"; }
          git diff origin/main -- spec/openapi.yaml > spec.diff || true
          {
            echo "The spec of [voucherly-docs@${DOCS_REF}](https://github.com/voucherly/voucherly-docs/blob/${DOCS_REF}/static/download/openapi.yaml), with the models, requests and enums regenerated by \`tools/generate.php\`."
            echo
            echo "## Checks"
            echo
            echo "- Generator: $(status "$GENERATE_EXIT")"
            echo "- Tests: $(status "$TESTS_EXIT")"
            echo "- Coverage of the spec: $(status "$COVERAGE_EXIT")"
            if [ "$GENERATE_EXIT" != "0" ]; then
              echo
              echo "The generator stopped, so the models, requests and enums are the previous ones:"
              echo
              echo '```'
              tail -c 6000 generate.log
              echo '```'
            fi
            if [ "$COVERAGE_EXIT" != "0" ]; then
              echo
              echo '```'
              head -c 12000 coverage.log
              echo '```'
            fi
            if [ "$TESTS_EXIT" != "0" ]; then
              echo
              echo "<details><summary>Test output</summary>"
              echo
              echo '```'
              sed "s|$PWD/||g" tests.log | tail -c 12000
              echo '```'
              echo "</details>"
            fi
            echo
            echo "## To do by hand"
            echo
            echo "Follow \`.claude/skills/sync-api/SKILL.md\` from step 2, on this branch, against \`main\`:"
            echo
            echo "- [ ] read \`git diff main -- spec/openapi.yaml\` and classify the release: patch, minor or major"
            echo "- [ ] add or remove the service methods, their entries in \`spec/coverage.json\` and their tests, for the operations listed above"
            echo "- [ ] bump \`VoucherlyClient::VERSION\` and add the section to \`CHANGELOG.md\`"
            echo "- [ ] run the live tests against the sandbox"
            echo
            echo "<details><summary>Changes to the spec</summary>"
            echo
            echo '```diff'
            head -c 25000 spec.diff
            echo '```'
            echo "</details>"
          } > pr-body.md
          if [ "$EXISTING_PR" = "true" ]; then
            gh pr edit "$BRANCH" --body-file pr-body.md
          else
            gh pr create --base main --head "$BRANCH" --title "Sync the API spec ($(date -u +%Y-%m-%d))" --body-file pr-body.md
          fi
          echo "Pull request updated from branch ${BRANCH}." >> "$GITHUB_STEP_SUMMARY"
