name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag, VoucherlyClient::VERSION and CHANGELOG.md agree
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(sed -nE "s/.*const VERSION = '([^']+)'.*/\1/p" lib/VoucherlyClient.php)
          if [ "$version" != "$code" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match VoucherlyClient::VERSION $code."
            exit 1
          fi
          if ! grep -qE "^## ${version//./\\.}( |$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  # Packagist publishes the tag on its own, through its GitHub hook, so there is no publish job: the release records what was published.
  release:
    name: GitHub release
    needs: [version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Notes from CHANGELOG.md
        run: awk -v v="${{ needs.version.outputs.version }}" 'index($0, "## " v) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
